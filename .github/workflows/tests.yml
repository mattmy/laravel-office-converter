name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '10'
          - php: '8.3'
            laravel: '12'
            testbench: '10'
          - php: '8.4'
            laravel: '12'
            testbench: '10'
          - php: '8.5'
            laravel: '12'
            testbench: '10'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
          - php: '8.4'
            laravel: '13'
            testbench: '11'
          - php: '8.5'
            laravel: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, zip
          coverage: none
      - run: composer require --no-update "illuminate/filesystem:^${{ matrix.laravel }}" "illuminate/http:^${{ matrix.laravel }}" "illuminate/support:^${{ matrix.laravel }}"
      - run: composer require --dev --no-update "orchestra/testbench:^${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/pest
      - run: composer audit

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, zip
          coverage: none
      - run: composer require --no-update "illuminate/filesystem:^12.0" "illuminate/http:^12.0" "illuminate/support:^12.0"
      - run: composer require --dev --no-update "orchestra/testbench:^10.0" "pestphp/pest:^3.0" "pestphp/pest-plugin-laravel:^3.0"
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/pest
      - run: composer audit

  libreoffice:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, zip
          coverage: none
      - run: composer require --no-update "illuminate/filesystem:^12.0" "illuminate/http:^12.0" "illuminate/support:^12.0"
      - run: composer require --dev --no-update "orchestra/testbench:^10.0" "pestphp/pest:^3.0" "pestphp/pest-plugin-laravel:^3.0"
      - run: composer update --prefer-dist --no-interaction
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --no-progress -y
      - if: runner.os == 'Windows'
        run: vendor/bin/pest --filter=symlinked --fail-on-skipped
      - if: runner.os != 'Windows'
        run: LIBREOFFICE_BINARY=soffice vendor/bin/pest --testsuite=Integration --fail-on-skipped
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LIBREOFFICE_BINARY = 'C:\Program Files\LibreOffice\program\soffice.com'
          vendor/bin/pest --testsuite=Integration --fail-on-skipped

  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, zip
          coverage: none
      - run: composer archive --format=zip
      - run: unzip -l mattmy-laravel-office-converter-*.zip | tee archive.txt
      - run: '! grep -E "(^|/)(tests|vendor|\.github|composer\.lock)(/|$)" archive.txt'
