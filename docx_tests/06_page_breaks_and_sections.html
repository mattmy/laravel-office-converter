<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>Page Breaks</title></head>
<body style="font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:11pt;line-height:1.5;margin:36pt;">
<h1 style="color:#1F4E79;">分頁與章節測試</h1>
<p>第一頁內容。</p>
<p style="page-break-before:always;"></p>
<h1 style="color:#1F4E79;">第二頁</h1>
<p>這段應從新頁面開始。</p>
<p style="page-break-after:always;">此段後應強制分頁。</p>
<h1 style="color:#1F4E79;">第三頁</h1><p>測試 page-break-after。</p>
</body></html>
