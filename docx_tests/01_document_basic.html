<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>DOCX Safe HTML - Basic Document</title>
</head>
<body style="font-family:'Microsoft JhengHei', Arial, sans-serif; font-size:11pt; line-height:1.5; color:#222222; margin:36pt;">
    <h1 style="font-size:24pt; color:#1F4E79; text-align:center; margin:0 0 18pt 0;">HTML → DOCX 基本文書測試</h1>
    <p style="margin:0 0 10pt 0;">這份 HTML 採用適合 LibreOffice Writer 匯入的保守格式，主要使用段落、標題、清單、表格與簡單 inline style。</p>
    <h2 style="font-size:16pt; color:#2F5597; margin:18pt 0 8pt 0;">文字格式</h2>
    <p style="margin:0 0 10pt 0;">一般文字、<strong>粗體文字</strong>、<em>斜體文字</em>、<u>底線文字</u>、H<sub>2</sub>O、E = mc<sup>2</sup>。</p>
    <p style="margin:0 0 10pt 0; color:#C00000;">這是一段紅色文字，用來確認字型顏色是否能保留。</p>
    <h2 style="font-size:16pt; color:#2F5597; margin:18pt 0 8pt 0;">段落對齊</h2>
    <p style="text-align:left; margin:0 0 8pt 0;">靠左對齊。</p>
    <p style="text-align:center; margin:0 0 8pt 0;">置中對齊。</p>
    <p style="text-align:right; margin:0 0 8pt 0;">靠右對齊。</p>
    <h2 style="font-size:16pt; color:#2F5597; margin:18pt 0 8pt 0;">多語系</h2>
    <p style="margin:0 0 8pt 0;">繁體中文：這是一段繁體中文測試內容。</p>
    <p style="margin:0 0 8pt 0;">English: The quick brown fox jumps over the lazy dog.</p>
    <p style="margin:0 0 8pt 0;">日本語：これは日本語のテスト文章です。</p>
</body>
</html>
