<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>DOCX Safe HTML - Information Blocks</title>
</head>
<body style="font-family:'Microsoft JhengHei', Arial, sans-serif; font-size:11pt; line-height:1.5; color:#222222; margin:36pt;">
    <h1 style="font-size:22pt; color:#1F4E79; margin:0 0 18pt 0;">資訊區塊與警告區塊</h1>
    <p style="margin:0 0 12pt 0;">本頁所有區塊都使用 table + td 實作，不依賴 div box model。</p>

    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin-bottom:12pt;">
        <tr><td style="border:1pt solid #4472C4; background-color:#DDEBF7; padding:10pt;"><strong style="color:#1F4E79;">資訊區塊</strong><br>這是一個適合轉換成 DOCX 的資訊提示框。</td></tr>
    </table>
    <br />
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin-bottom:12pt;">
        <tr><td style="border:1pt solid #BF9000; background-color:#FFF2CC; padding:10pt;"><strong style="color:#7F6000;">注意事項</strong><br>請確認資料內容正確後再執行下一步。</td></tr>
    </table>
    <br />
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin-bottom:12pt;">
        <tr><td style="border:1pt solid #C55A11; background-color:#FCE4D6; padding:10pt;"><strong style="color:#843C0C;">警告區塊</strong><br>此操作可能會影響既有資料，請先備份。</td></tr>
    </table>
    <br />
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin-bottom:12pt;">
        <tr><td style="border:1pt solid #70AD47; background-color:#E2F0D9; padding:10pt;"><strong style="color:#375623;">成功訊息</strong><br>文件轉換已完成，格式檢查通過。</td></tr>
    </table>
</body>
</html>
