<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>Vertical Align</title></head>
<body style="font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:11pt;margin:36pt;">
<h1 style="color:#1F4E79;">儲存格垂直對齊測試</h1>
<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;"><tr>
<td style="border:1pt solid #777;padding:8pt;height:80pt;vertical-align:top;">Top</td>
<td style="border:1pt solid #777;padding:8pt;height:80pt;vertical-align:middle;">Middle</td>
<td style="border:1pt solid #777;padding:8pt;height:80pt;vertical-align:bottom;">Bottom</td>
</tr></table>
</body></html>
