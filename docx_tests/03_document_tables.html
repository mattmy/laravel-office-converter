<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>DOCX Safe HTML - Tables</title>
</head>
<body style="font-family:'Microsoft JhengHei', Arial, sans-serif; font-size:10.5pt; color:#222222; margin:30pt;">
    <h1 style="font-size:22pt; color:#7030A0; margin:0 0 14pt 0;">DOCX 表格測試</h1>
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse;">
        <tr style="background-color:#4472C4; color:#FFFFFF;">
            <th style="border:1pt solid #333333; padding:7pt; width:10%; color:#FFFFFF;">編號</th>
            <th style="border:1pt solid #333333; padding:7pt; width:25%; color:#FFFFFF;">項目</th>
            <th style="border:1pt solid #333333; padding:7pt; width:20%; color:#FFFFFF;">狀態</th>
            <th style="border:1pt solid #333333; padding:7pt; width:45%; color:#FFFFFF;">說明</th>
        </tr>
        <tr>
            <td style="border:1pt solid #999999; padding:7pt; text-align:center;">1</td>
            <td style="border:1pt solid #999999; padding:7pt;">基本文字</td>
            <td style="border:1pt solid #999999; padding:7pt; text-align:center; background-color:#E2F0D9;">PASS</td>
            <td style="border:1pt solid #999999; padding:7pt;">粗體、字色與段落格式。</td>
        </tr>
        <tr>
            <td style="border:1pt solid #999999; padding:7pt; text-align:center;">2</td>
            <td style="border:1pt solid #999999; padding:7pt;">資訊框</td>
            <td style="border:1pt solid #999999; padding:7pt; text-align:center; background-color:#FFF2CC;">CHECK</td>
            <td style="border:1pt solid #999999; padding:7pt;">使用 table 與 td 來避免 div 跑版。</td>
        </tr>
    </table>

    <h2 style="font-size:16pt; color:#7030A0; margin:20pt 0 8pt 0;">合併儲存格</h2>
    <table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse;">
        <tr>
            <td rowspan="2" style="border:1pt solid #666666; padding:8pt; width:20%; text-align:center; vertical-align:middle;">rowspan</td>
            <td colspan="2" style="border:1pt solid #666666; padding:8pt; text-align:center; background-color:#D9EAF7;">colspan</td>
        </tr>
        <tr>
            <td style="border:1pt solid #666666; padding:8pt; text-align:center;">A</td>
            <td style="border:1pt solid #666666; padding:8pt; text-align:center;">B</td>
        </tr>
    </table>
</body>
</html>
