<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>Table Widths</title></head>
<body style="font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:11pt;margin:36pt;">
<h1 style="color:#1F4E79;">表格寬度與對齊測試</h1>
<table width="50%" cellpadding="0" cellspacing="0" style="width:50%;border-collapse:collapse;"><tr><td style="border:1pt solid #777;padding:8pt;">50% 靠左表格</td></tr></table>
<p>&nbsp;</p>
<table width="70%" cellpadding="0" cellspacing="0" align="center" style="width:70%;border-collapse:collapse;"><tr><td style="border:1pt solid #777;padding:8pt;text-align:center;">70% 置中表格</td></tr></table>
<p>&nbsp;</p>
<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;"><tr>
<td style="border:1pt solid #777;padding:8pt;width:20%;">20%</td>
<td style="border:1pt solid #777;padding:8pt;width:30%;">30%</td>
<td style="border:1pt solid #777;padding:8pt;width:50%;">50%</td>
</tr></table>
</body></html>
