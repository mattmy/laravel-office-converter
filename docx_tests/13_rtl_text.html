<h1 style="color:#1F4E79;">RTL 文字測試</h1>
<p>LTR English: This is a left-to-right sentence.</p>
<p dir="rtl" style="text-align:right;">العربية: هذا نص تجريبي باللغة العربية.</p>
<p dir="rtl" style="text-align:right;">עברית: זהו משפט בדיקה בעברית.</p>
<p>Mixed: English + العربية + 中文</p>
